    <link rel="stylesheet" href="assets/docsify5/themes/addons/core-dark.min.css" id="theme_dark"
      media="(prefers-color-scheme: dark)"/>
    <!-- DSH 风格主题层：只覆盖 CSS 变量，必须排在上面几个之后 -->
    <link rel="stylesheet" href="assets/plugins/dsh-theme.css"/>
    <!-- 主题：auto（跟随系统）/ dark / light，手动选过就记住；深色层靠 <html class="dark-theme"> + 这个 link 的 media 控制 -->
    <script>
      (function () {
        var mql = window.matchMedia('(prefers-color-scheme: dark)')
        function stored() {
          try { return localStorage.getItem('theme') } catch (e) { return null }
        }
        function apply(dark) {
          document.documentElement.classList.toggle('dark-theme', dark)
          var link = document.getElementById('theme_dark')
          if (link) link.media = dark ? 'all' : 'not all'
        }
        var s = stored()
        apply(s === 'dark' || (s !== 'light' && mql.matches))
        mql.addEventListener('change', function (e) {
          var cur = stored()
          if (cur === 'dark' || cur === 'light') return
          apply(e.matches)
        })
      })()
    </script>

  <script>
    window.$docsify = {
      name: 'MoluranliStudy',
      repo: false,
      maxLevel: 5,//最大支持渲染的标题层级
      subMaxLevel: 3,
      homepage: 'README.md',
      //封面单独显示
      onlyCover: true,
      coverpage: true,
      loadSidebar: true,
      //找不到页面时渲染 _404.md
      notFoundPage: true,
      auto2top: true,//切换页面后是否自动跳转到页面顶部
      //全文搜索
      search: {
        paths: 'auto',
        placeholder: '搜索笔记…',
        noData: '找不到结果',
        // 搜索标题的最大层级, 1 - 6
        depth: 3,
      },
      //字数统计：用中文单位（XX 字 | N 分钟）
      count: {
        language: 'chinese',
        position: 'top',
        margin: '0 0 8px',
        fontsize: '0.85em',
        color: 'rgb(140,140,140)'
      },
      //返回顶部（图标已本地化，text 留空才会走图标）
      scrollToTop: {
        auto: true,
        text: '',
        icon: 'arrow-up-1',
        right: 20,
        bottom: 20,
        width: 40,
        height: 40,
        offset: 500
      },
      //代码快复制粘贴设置
      copyCode: {
        buttonText : '复制',
        errorText  : '复制失败',
        successText: '已复制'
      },
      //结尾章节跳转
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节',
        crossChapter: true,
        crossChapterText: true,
      },
      //自定义图片
      corner: {
        url: "https://github.com/moluranli",
        // you can set the image link here
        icon: "assets/img/corner.webp",
        // the size of the image
        width: 80,
        height: 80
      },
      //更新时间（{docsify-updated} 占位符中间不能有空格，否则不会被替换）
      timeUpdater: {
        text: "<div align='right' width='200px' style='color:gray;font-size:14px'>更新于 {docsify-updated}</div>",
        formatUpdated: "{YYYY}-{MM}-{DD} {HH}:{mm}",
        whereToPlace: "top"
      },
      plugins: [
        EditOnGithubPlugin.create(
          'https://github.com/moluranli/moluranliStudy/tree/master/',
          'https://github.com/moluranli/moluranliStudy/edit/master/',
          '在 GitHub 上编辑本页'
        ),
        // docsify 自己替换 {docsify-updated} 需要 updatedAt（静态站拿不到），
        // 这里退一步用页面自身的 Last-Modified 兜底，日期来源是最近一次部署。
        function (hook) {
          hook.doneEach(function () {
            var section = document.querySelector('.markdown-section')
            if (!section || section.textContent.indexOf('{docsify-updated}') === -1) return
            var d = new Date(document.lastModified)
            var p = function (n) { return ('0' + n).slice(-2) }
            var stamp = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
              ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
            var walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT)
            var node
            while ((node = walker.nextNode())) {
              if (node.nodeValue.indexOf('{docsify-updated}') > -1) {
                node.nodeValue = node.nodeValue.replace(/\{docsify-updated\}/g, stamp)
              }
            }
          })
        },
        // 图片懒加载：单篇笔记动辄几十张截图，滚到哪张才下载哪张
        function (hook) {
          hook.doneEach(function () {
            var imgs = document.querySelectorAll('.markdown-section img')
            for (var i = 0; i < imgs.length; i++) {
              var img = imgs[i]
              if (img.getAttribute('data-lazy')) continue
              img.setAttribute('data-lazy', '1')
              img.setAttribute('loading', 'lazy')
              img.setAttribute('decoding', 'async')
            }
          })
        }
      ],
    }
  </script>

  <!--离线模式：network-first，改完文件刷新即生效-->
  <script>
    if ('serviceWorker' in navigator) {
      var reloading = false
      var hadController = !!navigator.serviceWorker.controller
      // 旧 sw 被新版本替换时自动刷新一次；首次访问不刷新
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading || !hadController) return
        reloading = true
        window.location.reload()
      })
      navigator.serviceWorker
        .register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) { reg.update() })
        .catch(function () {})
    }
  </script>
  <!--切换主题：跟随系统 → 深色 → 浅色 循环-->
  <script>
    function changeStyle() {
      var root = document.documentElement
      var mql = window.matchMedia('(prefers-color-scheme: dark)')
      var btn = document.getElementById('theme_switch')
      try { var cur = localStorage.getItem('theme') } catch (e) { var cur = null }
      var next = cur === null || cur === 'auto' ? 'dark' : (cur === 'dark' ? 'light' : 'auto')
      if (next === 'auto') { try { localStorage.removeItem('theme') } catch (e) {} }
      else { try { localStorage.setItem('theme', next) } catch (e) {} }
      var dark = next === 'auto' ? mql.matches : next === 'dark'
      root.classList.toggle('dark-theme', dark)
      var link = document.getElementById('theme_dark')
      if (link) link.media = dark ? 'all' : 'not all'
      if (btn) btn.title = '主题：' + (next === 'auto' ? '跟随系统' : (next === 'dark' ? '深色' : '浅色'))
    }
  </script>
