<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>MoluranliStudy · Java 学习笔记</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="MoluranliStudy：Java 学习笔记，包含 Java 基础、集合、JVM、MySQL、Redis、设计模式与秋招面试题。"/>
  <meta name="keywords" content="Java,Java基础,JVM,MySQL,Redis,设计模式,面试题,学习笔记"/>
  <meta name="author" content="moluranli"/>
  <meta name="theme-color" content="#2c3e50"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="MoluranliStudy · Java 学习笔记"/>
  <meta property="og:description" content="Java 学习笔记：基础、集合、JVM、MySQL、Redis、设计模式与秋招面试题。"/>
  <meta property="og:url" content="https://moluranli.github.io/moluranliStudy/"/>
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"/>
    <!-- 样式与脚本全部本地化到 assets/，不再依赖 jsdelivr / unpkg 等 CDN -->
    <link rel="stylesheet" href="assets/docsify/vue.css" id="theme_style"/>
    <!-- 记住上次选的主题，避免刷新后闪一下 -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('theme_style').href = 'assets/docsify/theme-simple-dark.css'
            document.documentElement.className += ' dark-theme'
          }
        } catch (e) {}
      })()
    </script>
    <link rel="shortcut icon" href="moluranliStudy.ico">
    <style>
      /* docsify 默认给封面随机取一个色相做渐变，每次刷新颜色都不一样，这里固定成站点的绿蓝调 */
      section.cover {
        background: linear-gradient(135deg, #eaf7f1 0%, #e6f0fb 100%) !important;
      }
      html.dark-theme section.cover {
        background: linear-gradient(135deg, #131a21 0%, #0e1419 100%) !important;
      }
      /* docsify 默认把封面按钮里"最后一个"高亮，这里改成第一个（开始阅读）为主按钮 */
      section.cover .cover-main > p:last-child a:last-child {
        background-color: transparent;
        color: var(--theme-color, #42b983);
      }
      section.cover .cover-main > p:last-child a:first-child {
        background-color: var(--theme-color, #42b983);
        color: #fff;
      }
      section.cover .cover-main > p:last-child a:last-child:hover,
      section.cover .cover-main > p:last-child a:first-child:hover {
        color: inherit;
        opacity: .8;
      }
    </style>
</head>

<body>
  <!--标签栏-->
  <!--导航栏-->
  <nav class="app-nav">
    <a href="#/./docs/a-1Java基础巩固">快速开始</a>
    <a href="javascript:void(0);" onclick="changeStyle()">主题切换</a>
    <a href="https://github.com/moluranli">Github</a>
    <a href="#/./docs/about">关于站点</a>
  </nav>
  <div id="app"></div>
  <!-- docsify-edit-on-github -->
  <script src="assets/plugins/docsify-edit-on-github.js"></script>
  <script>
    window.$docsify = {
      name: 'MoluranliStudy',
      repo: false,
      maxLevel: 5,//最大支持渲染的标题层级
      subMaxLevel: 3,
      homepage: 'README.md',
      //封面单独显示
      onlyCover: true,
      coverpage: true,
      loadSidebar: true,
      //找不到页面时渲染 _404.md
      notFoundPage: true,
      auto2top: true,//切换页面后是否自动跳转到页面顶部
      //全文搜索
      search: {
        //maxAge: 86400000, // 过期时间，单位毫秒，默认一天
        paths: 'auto',
        placeholder: '搜索笔记…',
        noData: '找不到结果',
        // 搜索标题的最大程级, 1 - 6
        depth: 3,
      },
      //字数统计：用中文单位（XX 字 | N 分钟）
      count: {
        language: 'chinese',
        position: 'top',
        margin: '0 0 8px',
        fontsize: '0.85em',
        color: 'rgb(140,140,140)'
      },
      //返回顶部（图标已本地化，text 留空才会走图标）
      scrollToTop: {
        auto: true,
        text: '',
        icon: 'arrow-up-1',
        right: 20,
        bottom: 20,
        width: 40,
        height: 40,
        offset: 500
      },
      //代码快复制粘贴设置
      copyCode: {
        buttonText : '复制',
        errorText  : '复制失败',
        successText: '已复制'
      },
      //结尾章节跳转
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节',
        crossChapter: true,
        crossChapterText: true,
      },
      //自定义图片
      corner: {
        url: "https://github.com/moluranli",
        // you can set the image link here
        icon: "assets/img/corner.png",
        // the size of the image
        width: 80,
        height: 80
      },
      //更新时间（{docsify-updated} 占位符中间不能有空格，否则不会被替换）
      timeUpdater: {
        text: "<div align='right' width='200px' style='color:gray;font-size:14px'>更新于 {docsify-updated}</div>",
        formatUpdated: "{YYYY}-{MM}-{DD} {HH}:{mm}",
        whereToPlace: "top"
      },
      plugins: [
        EditOnGithubPlugin.create(
          'https://github.com/moluranli/moluranliStudy/tree/master/',
          'https://github.com/moluranli/moluranliStudy/edit/master/',
          '在 GitHub 上编辑本页'
        ),
        // docsify 自己替换 {docsify-updated} 需要 updatedAt（静态站拿不到），
        // 这里退一步用页面自身的 Last-Modified 兜底，日期来源是最近一次部署。
        function (hook) {
          hook.doneEach(function () {
            var section = document.querySelector('.markdown-section')
            if (!section || section.textContent.indexOf('{docsify-updated}') === -1) return
            var d = new Date(document.lastModified)
            var p = function (n) { return ('0' + n).slice(-2) }
            var stamp = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
              ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
            var walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT)
            var node
            while ((node = walker.nextNode())) {
              if (node.nodeValue.indexOf('{docsify-updated}') > -1) {
                node.nodeValue = node.nodeValue.replace(/\{docsify-updated\}/g, stamp)
              }
            }
          })
        }
      ],
    }
  </script>
  <script src="assets/docsify/docsify.min.js"></script>
  <!--Java代码高亮-->
  <script src="assets/prism/prism-java.js"></script>
  <!--全文搜索,直接用官方提供的无法生效-->
  <script src="assets/docsify/plugins/search-4.5.9.min.js"></script>
  <!-- 复制到剪贴板 -->
  <script src="assets/plugins/docsify-copy-code.js"></script>
  <!-- 图片缩放 -->
  <script src="assets/docsify/plugins/zoom-image.js"></script>
  <!-- 字数统计 -->
  <script src="assets/plugins/docsify-countable.js"></script>
  <!--滚动到页面顶端-->
  <script src="assets/plugins/docsify-scroll-to-top.js"></script>
  <!--emoji表情解析-->
  <script src="assets/docsify/plugins/emoji.min.js"></script>
  <!--分页-->
  <script src="assets/plugins/docsify-pagination.min.js"></script>
  <!--右上角自定义图片-->
  <script src="assets/plugins/docsify-corner.js"></script>
  <!--更新时间-->
  <script src="assets/plugins/docsify-time-updater.min.js"></script>
  <!--提示高亮-->
  <script src="assets/plugins/docsify-flexible-alerts.js"></script>
  <!--离线模式：network-first，改完文件刷新即生效-->
  <script>
    if ('serviceWorker' in navigator) {
      var reloading = false
      var hadController = !!navigator.serviceWorker.controller
      // 旧 sw 被新版本替换时自动刷新一次；首次访问不刷新
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading || !hadController) return
        reloading = true
        window.location.reload()
      })
      navigator.serviceWorker
        .register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) { reg.update() })
        .catch(function () {})
    }
  </script>
  <!--切换主题-->
  <script>
    function changeStyle(){
      var css = document.getElementById('theme_style')
      var light = 'assets/docsify/vue.css'
      var dark = 'assets/docsify/theme-simple-dark.css'
      var toDark = css.getAttribute('href').indexOf('theme-simple-dark') === -1
      css.href = toDark ? dark : light
      document.documentElement.classList.toggle('dark-theme', toDark)
      try { localStorage.setItem('theme', toDark ? 'dark' : 'light') } catch (e) {}
    }
  </script>
</body>

</html>
